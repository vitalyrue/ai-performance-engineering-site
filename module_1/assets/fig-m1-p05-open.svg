<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img"><title>Part V contains integrated cases, logging practices, and release decisions</title><rect width="100%" height="100%" fill="#FFFDF7"/><g font-family="Arial, sans-serif"><rect x="30" y="30" width="555" height="550" rx="16" fill="#EDF5FA" stroke="#17365D" stroke-width="3"/><text x="54" y="76" font-size="30" font-weight="600" fill="#17365D">12 Integrated cases</text><text x="54" y="128" font-size="28" font-weight="400" fill="#17365D">Evaluation, RAG and support-</text><text x="54" y="168" font-size="28" font-weight="400" fill="#17365D">agent cases</text><text x="54" y="220" font-size="28" font-weight="400" fill="#17365D">Inspect inputs, results and</text><text x="54" y="260" font-size="28" font-weight="400" fill="#17365D">checks</text><text x="54" y="312" font-size="28" font-weight="400" fill="#17365D">Run a small subset with local</text><text x="54" y="352" font-size="28" font-weight="400" fill="#17365D">stand-ins</text><rect x="620" y="30" width="555" height="550" rx="16" fill="#EDF5FA" stroke="#17365D" stroke-width="3"/><text x="644" y="76" font-size="30" font-weight="600" fill="#17365D">13 Logging execution</text><text x="644" y="128" font-size="28" font-weight="400" fill="#17365D">What to log at each stage</text><text x="644" y="180" font-size="28" font-weight="400" fill="#17365D">W3C, OpenTelemetry and OWASP</text><text x="644" y="232" font-size="28" font-weight="400" fill="#17365D">Logging, tracing and</text><text x="644" y="272" font-size="28" font-weight="400" fill="#17365D">evaluation tools</text><text x="644" y="324" font-size="28" font-weight="400" fill="#17365D">Use logs to investigate a</text><text x="644" y="364" font-size="28" font-weight="400" fill="#17365D">failure</text><rect x="1210" y="30" width="555" height="550" rx="16" fill="#EDF5FA" stroke="#17365D" stroke-width="3"/><text x="1234" y="76" font-size="30" font-weight="600" fill="#17365D">14 Release decisions</text><text x="1234" y="128" font-size="28" font-weight="400" fill="#17365D">Choose a sufficient</text><text x="1234" y="168" font-size="28" font-weight="400" fill="#17365D">architecture</text><text x="1234" y="220" font-size="28" font-weight="400" fill="#17365D">Diagnose before changing</text><text x="1234" y="260" font-size="28" font-weight="400" fill="#17365D">components</text><text x="1234" y="312" font-size="28" font-weight="400" fill="#17365D">Check evidence for release</text><text x="1234" y="364" font-size="28" font-weight="400" fill="#17365D">Monitor the tested version</text><text x="1234" y="404" font-size="28" font-weight="400" fill="#17365D">after rollout</text></g></svg>